name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    uses: rigtorp/.github/.github/workflows/cpp-ci.yml@master
    with:
      cxx-standards: '["20"]'
      run-sanitizers: true
      enable-windows: true
      enable-macos: true
      warnings-as-errors: true

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
