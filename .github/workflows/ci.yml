name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    uses: rigtorp/.github/.github/workflows/cpp-ci.yml@master
    with:
      cxx-standards: '["20"]'
      run-sanitizers: true
      enable-windows: true
      enable-macos: true
      warnings-as-errors: true

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14
      - name: Configure, build, and test with MC/DC coverage
        env:
          CXX: g++-14
        run: |
          cmake --preset coverage
          cmake --build --preset coverage
          ctest --preset coverage
